name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, style and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's runners already ship the Android SDK. The setup-android
      # action is deliberately not used: it tries to install the long-removed
      # "tools" package and fails. Accepting the licences is enough for AGP to
      # provision the exact platform and build-tools the build pins.
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ktlint: formatting and Compose-aware style (see .editorconfig).
      - name: Kotlin style (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      # Android Lint: correctness, security and API-level issues.
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      # Includes the sshlib end-to-end tests against a throwaway local sshd
      # (they skip themselves if the runner has no sshd) and the Robolectric
      # screenshot renders.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/ktlint/**/*.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/index.html
